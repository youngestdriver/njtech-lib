name: auto-pr

on:
  push:
    branches:
      - "worktree-*"
      - "feat/*"

permissions:
  contents: read
  pull-requests: write

jobs:
  open-pr:
    runs-on: ubuntu-latest
    steps:
      - name: 创建或复用 PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="${{ github.ref_name }}"
          EXISTING=$(gh pr list -R "${{ github.repository }}" --head "$BRANCH" --state open --json url -q '.[0].url // empty')
          if [ -n "$EXISTING" ]; then
            echo "PR 已存在: $EXISTING"
            exit 0
          fi
          PR_URL=$(gh pr create -R "${{ github.repository }}" --base main --head "$BRANCH" \
            --title "自动 PR: $BRANCH" \
            --body '自动创建（push 触发）。CI 绿灯后自动合并。')
          PR_NUM=$(gh pr view -R "${{ github.repository }}" "$PR_URL" --json number -q .number)
          gh pr merge -R "${{ github.repository }}" "$PR_NUM" --auto --merge
